name: Fix Fragen startup freeze

on:
  push:
    paths:
      - .github/workflows/fix-sitelock.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fragen-sitelock-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text()
          loader = re.search(r'<script src="Build/[0-9a-f]+\.loader\.js\?v=[^"]+"></script>', html)
          if not loader:
              raise SystemExit('loader script tag not found')

          host_block = (
              '<script id="fragen-sitelock-host">\n'
              '// CrazySDK SiteLock freezes the game (the startup bar stops at 17/100) unless the page\n'
              '// looks like it is hosted on an allowed CrazyGames domain. Unity reads\n'
              '// Application.absoluteURL from document.URL, so report a crazygames.com URL there while\n'
              '// the real page keeps running on its own host.\n'
              '(function () {\n'
              "  var fake = 'https://www.crazygames.com/game/fragen';\n"
              '  try {\n'
              "    var d = Object.getOwnPropertyDescriptor(Document.prototype, 'URL');\n"
              "    Object.defineProperty(Document.prototype, 'URL', { configurable: true, get: function () { return fake; }, set: d && d.set });\n"
              '  } catch (e) {}\n'
              '})();\n'
              '</script>\n'
          )

          rewrite_block = (
              '<script id="fragen-rewrite">\n'
              '// Unity derives StreamingAssets from Application.absoluteURL, which the SiteLock override\n'
              '// points at crazygames.com. Send those requests back to files next to this page instead.\n'
              '(function () {\n'
              "  var FAKE = 'https://www.crazygames.com/game/';\n"
              '  function fix(value) {\n'
              '    var text = String(value);\n'
              "    return text.indexOf(FAKE) === 0 ? '/' + text.slice(FAKE.length) : value;\n"
              '  }\n'
              '  var nativeFetch = window.fetch;\n'
              '  if (nativeFetch) {\n'
              '    window.fetch = function (input, init) {\n'
              "      if (typeof input === 'string') input = fix(input);\n"
              "      else if (input && input.url && fix(input.url) !== input.url) input = new Request(fix(input.url), input);\n"
              '      return nativeFetch.call(this, input, init);\n'
              '    };\n'
              '  }\n'
              '  var nativeOpen = XMLHttpRequest.prototype.open;\n'
              '  XMLHttpRequest.prototype.open = function (method, url) {\n'
              '    var args = Array.prototype.slice.call(arguments);\n'
              '    args[1] = fix(url);\n'
              '    return nativeOpen.apply(this, args);\n'
              '  };\n'
              '})();\n'
              '</script>\n'
          )

          addition = ''
          if 'id="fragen-sitelock-host"' not in html:
              addition += host_block
          if 'id="fragen-rewrite"' not in html:
              addition += rewrite_block

          if not addition:
              print('index.html already patched')
              raise SystemExit(0)

          html = html[:loader.start()] + addition + html[loader.start():]
          path.write_text(html)
          print('patched index.html')
          PY

      - name: Commit and redeploy Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already patched"
          else
            git commit -m "Route Unity asset requests back to this host after the SiteLock override"
            git push
          fi
          sleep 5
          gh workflow run pages.yml --ref main
          echo "Pages redeploy requested"
