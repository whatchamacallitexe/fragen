name: Deploy Fragen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fragen-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble game files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/Build _site/StreamingAssets/aa/WebGL
          base="https://files.crazygames.com/fragen/224"
          curl --compressed -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$base/Build/bece21f8d09fbab3dbbf0faaeec1162c.loader.js" -o _site/Build/bece21f8d09fbab3dbbf0faaeec1162c.loader.js
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$base/Build/f4309c9912d461a9f12b3da028abb1ba.framework.js.br" -o /tmp/fragen.framework.js.br
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$base/Build/94dd788a9a422297e16b42770ede9a4f.wasm.br" -o /tmp/fragen.wasm.br
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$base/Build/9d925cb3a83f24e6325c2c545c2262d2.data.br" -o /tmp/fragen.data.br
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          for (const [src, out] of [
            ['/tmp/fragen.framework.js.br', '_site/Build/f4309c9912d461a9f12b3da028abb1ba.framework.js'],
            ['/tmp/fragen.wasm.br', '_site/Build/94dd788a9a422297e16b42770ede9a4f.wasm'],
            ['/tmp/fragen.data.br', '_site/Build/9d925cb3a83f24e6325c2c545c2262d2.data']
          ]) {
            fs.writeFileSync(out, zlib.brotliDecompressSync(fs.readFileSync(src)));
          }
          NODE
          cp index.html _site/index.html

      - name: Mirror addressables content
        shell: bash
        run: |
          set -euo pipefail
          base="https://files.crazygames.com/fragen/224/StreamingAssets/aa"
          out="_site/StreamingAssets/aa"
          for f in settings.json catalog.bin catalog.hash; do
            curl --compressed -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$base/$f" -o "$out/$f"
          done
          node - <<'NODE' > /tmp/bundles.txt
          const fs = require('fs');
          const text = fs.readFileSync('_site/StreamingAssets/aa/catalog.bin', 'latin1');
          const names = [...new Set(text.match(/[A-Za-z0-9_.\-]+_[0-9a-f]{32}\.bundle/g) || [])];
          if (names.length < 100) {
            console.error('Only found ' + names.length + ' bundle names in catalog.bin');
            process.exit(1);
          }
          console.log(names.join('\n'));
          NODE
          export base
          # Modest concurrency plus retries: the CDN throttles bursty clients.
          (cd "$out/WebGL" && xargs -a /tmp/bundles.txt -P 6 -I{} \
            curl -fsSL --retry 6 --retry-delay 3 --retry-all-errors "$base/WebGL/{}" -o "{}")
          expected=$(grep -c . /tmp/bundles.txt)
          actual=$(ls "$out/WebGL" | wc -l | tr -d ' ')
          echo "bundles expected=$expected downloaded=$actual"
          test "$expected" = "$actual"
          du -sh "$out/WebGL"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
