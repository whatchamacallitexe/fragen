<script>
(function () {
  var canvas = document.getElementById('unity-canvas');
  var loading = document.getElementById('loading');
  var bar = document.getElementById('bar');
  var status = document.getElementById('status');
  var error = document.getElementById('error');
  function fail(message) {
    console.error(message);
    loading.classList.remove('hidden');
    status.textContent = 'Could not start the game.';
    error.style.display = 'block';
    error.textContent = message;
  }
  if (typeof createUnityInstance !== 'function') {
    fail('Game loader did not initialize.');
    return;
  }
  createUnityInstance(canvas, {
    dataUrl: 'Build/9d925cb3a83f24e6325c2c545c2262d2.data?v=20261117a',
    frameworkUrl: 'Build/f4309c9912d461a9f12b3da028abb1ba.framework.js?v=20261117a',

    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'Lucky Try',
    productName: 'Fragen',
    productVersion: '1.0'
  }, function (progress) {
    var pct = Math.round(progress * 100);
    bar.style.width = pct + '%';
    status.textContent = 'Loading game files… ' + pct + '%';
  }).then(function (instance) {
    window.unityInstance = instance;
    loading.classList.add('hidden');
    setTimeout(function () { loading.remove(); }, 400);
  }).catch(function (e) {
    fail(e && e.message ? e.message : String(e));
  });
})();
</script>
